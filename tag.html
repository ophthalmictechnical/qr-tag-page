<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record Details</title>
<style>
  body{margin:0;padding:16px;background:#f5f7fa;font-family:"Segoe UI",Tahoma,sans-serif}
  .card{max-width:520px;margin:0 auto;background:#fff;border-radius:10px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  h1{font-size:1.1em;color:#2d2d4e;margin:0 0 16px}
  .row{margin-bottom:12px;font-size:14px}
  .row b{display:block;color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .row span{white-space:pre-line;color:#202124}
  .msg{color:#c5221f}
  .loading{color:#666}
</style></head>
<body><div class="card"><h1 id="title">Record Details</h1><div id="body"><p class="loading">Loading…</p></div></div>
<script>
(function () {
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKcSPUeDFPFCz5XXwlkSap_7W1lyFxX4mOt3CibUYMEW2RzXLe9_fc1-1BNHm_n5TvSQ/exec';
  var body  = document.getElementById('body');
  var title = document.getElementById('title');

  function render(type, fields) {
    title.textContent = (type === 'IO' ? 'Internal Operation' : 'In House Equipment') + ' — Record Details';
    body.innerHTML = '';
    fields.forEach(function (f) {
      if (!f[1]) return;
      var row = document.createElement('div'); row.className = 'row';
      var b = document.createElement('b'); b.textContent = f[0];
      var s = document.createElement('span'); s.textContent = f[1];
      row.appendChild(b); row.appendChild(s); body.appendChild(row);
    });
  }
  function fail(msg) { body.innerHTML = '<p class="msg"></p>'; body.firstChild.textContent = msg; }

  var job = new URLSearchParams(location.search).get('job');

  // Old tags (printed before this change) still work: they carry data in the #hash.
  if (!job && location.hash.length > 1) {
    try {
      var LABELS = [['j','Job Code'],['d','Date'],['s','Status'],['c','Customer/Company Name'],
                    ['m','Device Model'],['n','Serial Number'],['i','Issue Description'],['r','Notes / Remarks']];
      var b64 = location.hash.replace(/^#/, '').replace(/-/g,'+').replace(/_/g,'/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (var k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      var o = JSON.parse(new TextDecoder().decode(bytes));
      render(o.t, LABELS.map(function (p) { return [p[1], o[p[0]]]; }));
    } catch (e) { fail('Could not read this tag.'); }
    return;
  }

  if (!job) { fail('No job code in this link.'); return; }

  fetch(APPS_SCRIPT_URL + '?page=tagdata&job=' + encodeURIComponent(job))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res.ok) { fail(res.error || 'Record not found.'); return; }
      render(res.type, res.fields);
    })
    .catch(function () { fail('Could not load the record. Check your internet connection.'); });
})();
</script></body></html>
