<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Record Details</title>
<style>
  body{margin:0;padding:16px;background:#f5f7fa;font-family:"Segoe UI",Tahoma,sans-serif}
  .card{max-width:520px;margin:0 auto;background:#fff;border-radius:10px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  h1{font-size:1.1em;color:#2d2d4e;margin:0 0 16px}
  .row{margin-bottom:12px;font-size:14px}
  .row b{display:block;color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .row span{white-space:pre-line;color:#202124}
  .msg{color:#c5221f}
  .btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .btn{flex:1;min-width:140px;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
  .btn-copy{background:#667eea}
  .btn-copy.done{background:#0d6832}
  .btn-finish{background:#1f9d63}
  .btn-spare{background:#e8710a}
  .btn-status{background:#6d4c9f}
  .spare-form select{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #dadce0;border-radius:6px;font-size:14px;font-family:inherit;background:#fff}
  .status-form{border-color:#cdbfe6;background:#f7f3fd}
  .status-form h2{color:#4a2f7d}
  .status-form .btn-submit{background:#6d4c9f}

  /* DO / Job Sheet / Purchase Date panel */
  .info-panel{display:none;margin-top:14px;padding:14px;border:1px solid #a5d8e6;background:#f0fafd;border-radius:8px}
  .info-panel.show{display:block}
  .info-panel h2{font-size:.95em;color:#0e5566;margin:0 0 10px}
  .info-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #dff0f5;font-size:14px}
  .info-row:last-child{border-bottom:none}
  .info-row b{color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
  .info-row span{color:#202124;text-align:right;word-break:break-word}
  .info-row span.na{color:#c5221f;font-style:italic}
  .btn:disabled{opacity:.6;cursor:wait}
  .status-msg{margin-top:10px;font-size:13px;display:none}
  .status-msg.ok{color:#137333;display:block}
  .status-msg.err{color:#c5221f;display:block}

  /* Spare Part Request form */
  .spare-form{display:none;margin-top:14px;padding:14px;border:1px solid #f3c99a;background:#fff8f0;border-radius:8px}
  .spare-form.show{display:block}
  .spare-form h2{font-size:.95em;color:#8a4b00;margin:0 0 10px}
  .spare-form label{display:block;font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px}
  .spare-form label small{text-transform:none;font-weight:400;letter-spacing:0;color:#999}
  .spare-form input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #dadce0;border-radius:6px;font-size:14px;font-family:inherit}
  .spare-form input:focus{outline:none;border-color:#e8710a}
  .spare-actions{display:flex;gap:10px;margin-top:14px}
  .spare-actions .btn{min-width:0}
  .btn-submit{background:#e8710a}
  .btn-cancel{background:#f0f0f0;color:#444}
</style></head>
<body>
<div class="card">
  <h1 id="title">Record Details</h1>
  <div id="body"></div>
  <div class="info-panel" id="infoPanel">
    <h2>📄 DO / Job Sheet / Purchase Date</h2>
    <div id="infoBody"></div>
  </div>
  <div class="btns" id="btns" style="display:none">
    <button class="btn btn-copy" id="copyBtn">📋 Copy Details</button>
    <button class="btn btn-finish" id="finishBtn" style="display:none">✅ Finish Repair</button>
    <button class="btn btn-spare" id="spareBtn" style="display:none">🔧 Spare Part Request</button>
    <button class="btn btn-status" id="statusBtn" style="display:none">🔄 Update Status</button>  </div>

  <div class="spare-form" id="spareForm">
    <h2>🔧 Spare Part Request</h2>
    <label for="spareName">Spare Part Name</label>
    <input type="text" id="spareName" maxlength="200" autocomplete="off" placeholder="e.g. Optical Module">
    <label for="spareNumber">Spare Part Number <small>(optional)</small></label>
    <input type="text" id="spareNumber" maxlength="100" autocomplete="off" placeholder="e.g. 80005-203-002D">
    <div class="spare-actions">
      <button class="btn btn-cancel" id="spareCancelBtn" type="button">Cancel</button>
      <button class="btn btn-submit" id="spareSubmitBtn" type="button">Submit</button>
    </div>
  </div>

  <div class="spare-form status-form" id="statusForm">
    <h2>🔄 Update Status</h2>
    <label for="statusSelect">New Status</label>
    <select id="statusSelect"></select>
    <div class="spare-actions">
      <button class="btn btn-cancel" id="statusCancelBtn" type="button">Cancel</button>
      <button class="btn btn-submit" id="statusSubmitBtn" type="button">Update</button>
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>
</div>
<script>
(function () {
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzKcSPUeDFPFCz5XXwlkSap_7W1lyFxX4mOt3CibUYMEW2RzXLe9_fc1-1BNHm_n5TvSQ/exec';
  var body  = document.getElementById('body');
  var title = document.getElementById('title');
  var current = { type: '', fields: [] };

  function render(type, fields) {
    fields = fields.map(function (f) { return f[0] === 'Status' ? ['Status', 'Loading…'] : f; });
    current = { type: type, fields: fields.filter(function (f) { return f[1]; }) };
    title.textContent = (type === 'IO' ? 'Internal Operation' : 'In House Equipment') + ' — Record Details';
    body.innerHTML = '';
    current.fields.forEach(function (f) {
      var row = document.createElement('div'); row.className = 'row';
      var b = document.createElement('b'); b.textContent = f[0];
      var s = document.createElement('span'); s.textContent = f[1];
      row.appendChild(b); row.appendChild(s); body.appendChild(row);
    });
    document.getElementById('btns').style.display = 'flex';
    document.getElementById('finishBtn').style.display = 'block';
    // Spare Part Request only applies to Internal Operation records
    document.getElementById('spareBtn').style.display = 'block';
    document.getElementById('statusBtn').style.display = 'block';
    buildStatusOptions(type);
  }

  function fail(msg) {
    body.innerHTML = '<p class="msg"></p>';
    body.firstChild.textContent = msg;
  }

  function getField(label) {
    var f = current.fields.filter(function (x) { return x[0] === label; })[0];
    return f ? f[1] : '';
  }

  function showMsg(cls, text) {
    var m = document.getElementById('statusMsg');
    m.className = 'status-msg ' + cls; m.textContent = text;
  }

  // Update (or add) a displayed field by label
  function setField(label, value) {
    var found = false;
    body.querySelectorAll('.row').forEach(function (r) {
      if (r.querySelector('b').textContent === label) {
        r.querySelector('span').textContent = value;
        found = true;
      }
    });
    if (!found && value) {
      var row = document.createElement('div'); row.className = 'row';
      var b = document.createElement('b'); b.textContent = label;
      var s = document.createElement('span'); s.textContent = value;
      row.appendChild(b); row.appendChild(s);
      var statusRow = null;
      body.querySelectorAll('.row').forEach(function (r) {
        if (r.querySelector('b').textContent === 'Status') statusRow = r;
      });
      if (statusRow && statusRow.nextSibling) body.insertBefore(row, statusRow.nextSibling);
      else body.appendChild(row);
    }
    var hit = false;
    current.fields.forEach(function (f) { if (f[0] === label) { f[1] = value; hit = true; } });
    if (!hit && value) {
      var idx = -1;
      current.fields.forEach(function (f, i) { if (f[0] === 'Status') idx = i; });
      current.fields.splice(idx + 1, 0, [label, value]);
    }
  }

  // ── Copy Details ──
  document.getElementById('copyBtn').addEventListener('click', function () {
    var btn = this;
    var text = current.fields.map(function (f) { return f[0] + ': ' + f[1]; }).join('\n');
    function done(ok) {
      btn.textContent = ok ? '✓ Copied!' : '✕ Failed';
      btn.classList.toggle('done', ok);
      setTimeout(function () { btn.textContent = '📋 Copy Details'; btn.classList.remove('done'); }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); done(ok);
    }
  });

  // ── Finish Repair (no PIN) ──
  document.getElementById('finishBtn').addEventListener('click', function () {
    var btn = this;
    var job = getField('Job Code');
    if (!job) { showMsg('err', 'No job code found.'); return; }
    var targetLabel = /^IH-/i.test(job) ? 'Completed' : 'Finish Repair & Wait for delivery arrangement';
    if (!confirm('Mark ' + job + ' as "' + targetLabel + '"?')) return;
    
    btn.disabled = true; btn.textContent = '⏳ Saving…';
    fetch(APP_URL + '?page=finishrepair&job=' + encodeURIComponent(job))
    .then(function (r) { return r.text(); })
    .then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw new Error('Server did not return JSON. Check the deployment is "Anyone" and up to date.'); }
    })
    .then(function (res) {
      btn.disabled = false; btn.textContent = '✅ Finish Repair';
      if (!res.ok) { showMsg('err', res.error || 'Failed.'); return; }
      showMsg('ok', '✓ ' + job + ' status updated to: ' + res.status);
      setField('Status', res.status);
    })
    .catch(function (e) {
      btn.disabled = false; btn.textContent = '✅ Finish Repair';
      showMsg('err', 'Network error: ' + e.message);
    });
  });

  // ── Spare Part Request ──
  var spareForm = document.getElementById('spareForm');
  var spareName = document.getElementById('spareName');
  var spareNumber = document.getElementById('spareNumber');
  var spareSubmit = document.getElementById('spareSubmitBtn');

  document.getElementById('spareBtn').addEventListener('click', function () {
    document.getElementById('statusForm').classList.remove('show');
    spareForm.classList.toggle('show');
    if (spareForm.classList.contains('show')) {
      spareForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
      spareName.focus();
    }
  });

  document.getElementById('spareCancelBtn').addEventListener('click', function () {
    spareForm.classList.remove('show');
    spareName.value = ''; spareNumber.value = '';
  });

  spareSubmit.addEventListener('click', function () {
    var job = getField('Job Code');
    var name = spareName.value.trim();
    var number = spareNumber.value.trim();
    if (!job) { showMsg('err', 'No job code found.'); return; }
    if (!name) { showMsg('err', 'Please enter the spare part name.'); spareName.focus(); return; }

    spareSubmit.disabled = true; spareSubmit.textContent = '⏳ Saving…';
    fetch(APP_URL + '?page=sparepart&job=' + encodeURIComponent(job) +
          '&name=' + encodeURIComponent(name) +
          '&number=' + encodeURIComponent(number))
    .then(function (r) { return r.text(); })
    .then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw new Error('Server did not return JSON. Check the deployment is "Anyone" and up to date.'); }
    })
    .then(function (res) {
      spareSubmit.disabled = false; spareSubmit.textContent = 'Submit';
      if (!res.ok) { showMsg('err', res.error || 'Failed.'); return; }
      showMsg('ok', '✓ ' + job + ' status updated to: ' + res.status);
      setField('Status', res.status);
      setField('Spare Part Request', res.sparePartRequest);
      spareName.value = ''; spareNumber.value = '';
      spareForm.classList.remove('show');
    })
    .catch(function (e) {
      spareSubmit.disabled = false; spareSubmit.textContent = 'Submit';
      showMsg('err', 'Network error: ' + e.message);
    });
  });
  
  // ── Update Status (everything except Finish Repair / In Progress / Waiting for Spare Part) ──
  var STATUS_CHOICES_IO = ['Completed', 'Awaiting Manufacturer Repair', 'Unable to Repair & Sent Back',
                           'Reconditioned Unit', 'Pending PO'];
  var STATUS_CHOICES_IH = ['Available', 'Missing', 'Unable to Fix', 'Completed'];
  var statusForm   = document.getElementById('statusForm');
  var statusSelect = document.getElementById('statusSelect');
  var statusSubmit = document.getElementById('statusSubmitBtn');

  function buildStatusOptions(type) {
    var list = (type === 'IH') ? STATUS_CHOICES_IH : STATUS_CHOICES_IO;
    statusSelect.innerHTML = '';
    list.forEach(function (s) {
      var o = document.createElement('option'); o.value = s; o.textContent = s;
      statusSelect.appendChild(o);
    });
  }

  document.getElementById('statusBtn').addEventListener('click', function () {
    spareForm.classList.remove('show');
    statusForm.classList.toggle('show');
    if (statusForm.classList.contains('show')) statusForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  document.getElementById('statusCancelBtn').addEventListener('click', function () {
    statusForm.classList.remove('show');
  });

  statusSubmit.addEventListener('click', function () {
    var job = getField('Job Code');
    var status = statusSelect.value;
    if (!job) { showMsg('err', 'No job code found.'); return; }
    if (!confirm('Change ' + job + ' status to "' + status + '"?')) return;

    statusSubmit.disabled = true; statusSubmit.textContent = '⏳ Saving…';
    fetch(APP_URL + '?page=updatestatus&job=' + encodeURIComponent(job) +
          '&status=' + encodeURIComponent(status))
    .then(function (r) { return r.text(); })
    .then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw new Error('Server did not return JSON. Check the deployment is "Anyone" and up to date.'); }
    })
    .then(function (res) {
      statusSubmit.disabled = false; statusSubmit.textContent = 'Update';
      if (!res.ok) { showMsg('err', res.error || 'Failed.'); return; }
      showMsg('ok', '✓ ' + job + ' status updated to: ' + res.status);
      setField('Status', res.status);
      statusForm.classList.remove('show');
    })
    .catch(function (e) {
      statusSubmit.disabled = false; statusSubmit.textContent = 'Update';
      showMsg('err', 'Network error: ' + e.message);
    });
  });

  // ── DO / Job Sheet / Purchase Date (live) ──
  var infoPanel = document.getElementById('infoPanel');
  var infoBody  = document.getElementById('infoBody');

  function infoRow(label, value) {
    var row = document.createElement('div'); row.className = 'info-row';
    var b = document.createElement('b'); b.textContent = label;
    var s = document.createElement('span');
    var v = String(value || '').trim();
    if (!v || v.toUpperCase() === 'N/A') { s.textContent = 'Unavailable'; s.className = 'na'; }
    else { s.textContent = v; }
    row.appendChild(b); row.appendChild(s);
    return row;
  }

  function loadDoInfo() {
    var job = getField('Job Code');
    if (!job || current.type !== 'IO') return;

    infoPanel.classList.add('show');
    infoBody.textContent = '⏳ Loading…';
    fetch(APP_URL + '?page=doinfo&job=' + encodeURIComponent(job) + '&_=' + Date.now())
    .then(function (r) { return r.text(); })
    .then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw new Error('Server did not return JSON. Check the deployment is up to date.'); }
    })
    .then(function (res) {
      if (!res.ok) { infoBody.textContent = '⚠️ ' + (res.error || 'Could not load.'); return; }
      infoBody.innerHTML = '';
      infoBody.appendChild(infoRow('Job Sheet No.', res.jobSheetNo));
      infoBody.appendChild(infoRow('DO No.', res.doNo));
      infoBody.appendChild(infoRow('Purchase Date', res.purchaseDate));
    })
    .catch(function (e) { infoBody.textContent = '⚠️ ' + e.message; });
  }

  var liveBadge = document.createElement('div');
  liveBadge.style.cssText = 'font-size:12px;color:#666;margin-top:12px';
  document.getElementById('infoPanel').insertAdjacentElement('beforebegin', liveBadge);

  function setLiveStatus(status) {
    var found = false;
    body.querySelectorAll('.row').forEach(function (r) {
      if (r.querySelector('b').textContent === 'Status') {
        r.querySelector('span').textContent = status;
        found = true;
      }
    });
    if (!found && status) {   // QR had no status, so add the row
      var row = document.createElement('div'); row.className = 'row';
      var b = document.createElement('b'); b.textContent = 'Status';
      var s = document.createElement('span'); s.textContent = status;
      row.appendChild(b); row.appendChild(s);
      body.insertBefore(row, body.children[1] || null);
    }
    var hit = false;
    current.fields.forEach(function (f) { if (f[0] === 'Status') { f[1] = status; hit = true; } });
    if (!hit && status) current.fields.splice(1, 0, ['Status', status]);
  }

  function refreshStatus() {
    var job = getField('Job Code');
    if (!job) return;
        fetch(APP_URL + '?page=tagstatus&job=' + encodeURIComponent(job) + '&_=' + Date.now())
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var res;
        try { res = JSON.parse(t); }
        catch (e) { throw new Error('Not JSON: ' + t.slice(0, 60).replace(/\s+/g, ' ')); }
        if (!res.ok) { liveBadge.textContent = '⚠️ ' + (res.error || 'Could not refresh status'); setLiveStatus('Unavailable'); return; }
        setLiveStatus(res.status);
        liveBadge.textContent = '🟢 Live status · updated ' + new Date().toLocaleTimeString();
      })
      .catch(function (e) {
        liveBadge.textContent = '⚠️ ' + e.message;
        setLiveStatus('Unavailable');
      });
  }

  function startLive() {
    refreshStatus();   // one check each time the page loads or is refreshed
    loadDoInfo();      // live DO / Job Sheet / Purchase Date (Internal Operation tags only)
  }
  
  // ── Read the tag data from the QR link ──
  if (location.hash.length <= 1) { fail('No tag data in this link.'); return; }

  try {
    var LABELS = [['j','Job Code'],['d','Date'],['s','Status'],['b','Serviced by'],
              ['c','Customer/Company Name'],['m','Device Model'],['n','Serial Number'],
              ['p','Spare Part Request'],['i','Issue Description'],['a','Action Taken'],
              ['r','Notes / Remarks']];
    var b64 = location.hash.replace(/^#/, '').replace(/-/g,'+').replace(/_/g,'/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    var o = JSON.parse(new TextDecoder().decode(bytes));
    render(o.t, LABELS.map(function (p) { return [p[1], o[p[0]]]; }));
    startLive();
  } catch (e) { fail('Could not read this tag.'); }
})();
</script></body></html>
